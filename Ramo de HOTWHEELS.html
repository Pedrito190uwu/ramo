<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz 30 de septiembre🩵</title>
    <!-- Fuente de letra actualizada -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
<style>
    /* --- MÓDULO DE COLORES EDITABLES --- */
    :root {
        --color-petalo-principal: #00d9ff;
        --color-petalo-gradiente: #001f3f8a;
        --color-petalo-neon: rgba(0, 255, 200, 0.7);
        --color-centro-flor: #f0f8ff;
        --color-centro-flor-sombra: #add8e6;
        --color-luz-particula-1: #54cfff;
        --color-luz-particula-2: #ffffff;
        --color-tallo-principal: #0f8105;
        --color-tallo-hoja: #078f3f;
        --color-pasto-brillante: #5edb24;
        --color-sombra-hojas: rgba(27, 0, 35, 0.2);
        --color-luz-hojas: rgba(255, 255, 255, 0.2);
        --color-fondo-oscuro: #0505056e;
        --color-superposicion-fondo: rgba(10, 0, 20, 0.686);
        --color-titulo: #00f7ff;
        --color-titulo-neon: rgba(0, 238, 178, 0.378);
        --color-sombra-titulo: rgba(0, 0, 0, 0.321);
        --color-overlay-glow: rgba(40, 248, 255, 0.8);
        --color-overlay-title: #ffffff;
        --color-overlay-title-neon: rgba(255, 255, 255, 0.7);
    }

    *,
    *::after,
    *::before {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }

    body {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        min-height: 100vh;
        background-color: var(--color-fondo-oscuro);
        overflow: hidden;
        perspective: 1000px;
        font-family: 'Sour Gummy', sans-serif;
        position: relative;
        z-index: 1;
        /* ===== NUEVO: BLOQUEA LA SELECCIÓN DE TEXTO Y ELEMENTOS ===== */
        -webkit-user-select: none; /* Safari */
        -ms-user-select: none; /* IE 10+ y Edge */
        user-select: none; /* Sintaxis estándar */
    }

    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('https://www.dl.dropboxusercontent.com/scl/fi/znq37xevfdl16icq5i0yu/back1.png?rlkey=jjw1y8yesa9l8tq691e6ky4ue&st=yzqu8260');
        background-size: cover;
        background-position: center center;
        background-attachment: fixed;
        filter: blur(2px);
        z-index: -2;
    }

    .title-container {
        position: absolute;
        top: 8%;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        width: 90%;
        max-width: 1500px;
        opacity: 0;
        transition: opacity 1.2s ease-in-out 0.5s;
    }

    .main-title {
        color: var(--color-titulo);
        font-size: clamp(3rem, 10vw, 6rem);
        text-shadow: 0 0 5px rgba(9, 0, 25, 0.8), 0 0 10px var(--color-titulo-neon), 0 0 15px var(--color-titulo-neon), 2px 2px 5px var(--color-sombra-titulo);
        text-align: center;
        margin: 0;
        font-weight: 400;
    }

    .night {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: var(--color-superposicion-fondo);
        z-index: -1;
    }

    .flowers {
        position: relative;
        transform: scale(0.9);
    }

    .flower {
        position: absolute;
        bottom: 10vmin;
        transform-origin: bottom center;
        z-index: 10;
        --fl-speed: 0.8s;
    }

    .head-stem {
        position: absolute;
        bottom: 10vmin;
        transform-origin: bottom center;
    }

    .head-stem__image {
        width: 35vmin;
        height: 35vmin;
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%);
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        cursor: pointer;
        z-index: 11;
    }

    /* --- ESTILO PARA EL ENVOLTORIO --- */
    .flower-wrapping {
        position: absolute;
        bottom: -5vmin;
        left: 50%;
        transform: translateX(-50%);
        width: 150vmin;
        height: 130vmin;
        background-image: url('https://www.dl.dropboxusercontent.com/scl/fi/ut99bz10z4src03rpp8b6/ramo1.png?rlkey=2uzw8iulrnk3h5jszj5qgbodx&st=06mruz9t');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: bottom center;
        z-index: 0;
    }

    /*
        =============================================
        PANEL DE CONTROL PARA TODOS LOS TALLOS
        =============================================
    */
    /* TALLOS TRASEROS (LOS MÁS ALTOS) */
    .head-stem--6 { --h: 105vmin; --d: 0.1s; left: 50%; animation: sway-left-35 5.5s linear infinite; z-index: 1; }
    .head-stem--7 { --h: 110vmin; --d: 0s;   left: 50%; animation: sway-center 6s linear infinite; transform: scale(1.05); z-index: 1; }
    .head-stem--8 { --h: 102vmin; --d: 0.2s; left: 50%; animation: sway-right-35 5.2s linear infinite; z-index: 1; }
    /* TALLOS MEDIOS */
    .head-stem--1 { --h: 85vmin; --d: 0.4s; left: 50%; animation: sway-left-20 5s linear infinite; z-index: 5; }
    .head-stem--2 { --h: 95vmin; --d: 0.6s; left: 50%; animation: sway-center 5.8s linear infinite; z-index: 5; }
    .head-stem--3 { --h: 88vmin; --d: 0.5s; left: 50%; animation: sway-right-20 4.8s linear infinite; z-index: 5; }
    /* TALLOS INTERMEDIOS */
    .head-stem--4 { --h: 75vmin; --d: 0.8s; left: 50%; animation: sway-left-10 5.2s linear infinite; z-index: 8; }
    .head-stem--5 { --h: 72vmin; --d: 0.9s; left: 50%; animation: sway-right-10 5s linear infinite; z-index: 8; }
    /* FLORES AZULES (DELANTERAS) */
    .flower--1 { --h: 60vmin; --d: 1s; left: 50%; animation: sway-center 4s linear infinite; }
    .flower--2 { --h: 50vmin; --d: 1.2s; left: 50%; animation: sway-right-30 4s linear infinite; }
    .flower--3 { --h: 55vmin; --d: 1.1s; left: 50%; animation: sway-left-30 4s linear infinite; }

    /*
        =============================================
        LÓGICA INTERNA (NO TOCAR)
        =============================================
    */
    .head-stem .flower__line, .flower .flower__line { height: var(--h); animation-delay: var(--d); }
    .head-stem--1 .head-stem__image { background-image: url('https://www.dl.dropboxusercontent.com/scl/fi/o2bcfiim7r3fw7flb66w3/head1.png?rlkey=ufaylcfta852uzt9mlfnz3e1k&st=6d8df2et'); }
    .head-stem--2 .head-stem__image { background-image: url('https://www.dl.dropboxusercontent.com/scl/fi/mcpro51yi4c19mc2hbyne/head2.png?rlkey=3w1wiu6jpzyrpazl4qa5myy25&st=4ra0t29m'); }
    .head-stem--3 .head-stem__image { background-image: url('https://www.dl.dropboxusercontent.com/scl/fi/1h4skox54yz4anlz7i5tj/head3.png?rlkey=6g9etgkli7znmrg346y7qltew&st=78f59kyl'); }
    .head-stem--4 .head-stem__image { background-image: url('https://www.dl.dropboxusercontent.com/scl/fi/n8487mso31ia76g9v96co/head4.png?rlkey=hebrq842davchflvwz630cz07&st=wpa66q29'); }
    .head-stem--5 .head-stem__image { background-image: url('https://www.dl.dropboxusercontent.com/scl/fi/o2bcfiim7r3fw7flb66w3/head1.png?rlkey=ufaylcfta852uzt9mlfnz3e1k&st=6d8df2et'); }
    .head-stem--6 .head-stem__image { background-image: url('https://www.dl.dropboxusercontent.com/scl/fi/o2bcfiim7r3fw7flb66w3/head1.png?rlkey=ufaylcfta852uzt9mlfnz3e1k&st=6d8df2et'); }
    .head-stem--7 .head-stem__image { background-image: url('https://www.dl.dropboxusercontent.com/scl/fi/mcpro51yi4c19mc2hbyne/head2.png?rlkey=3w1wiu6jpzyrpazl4qa5myy25&st=4ra0t29m'); }
    .head-stem--8 .head-stem__image { background-image: url('https://www.dl.dropboxusercontent.com/scl/fi/n8487mso31ia76g9v96co/head4.png?rlkey=hebrq842davchflvwz630cz07&st=wpa66q29'); }

    /* ... (El resto de tus estilos CSS van aquí, no es necesario copiarlos todos de nuevo)... */

    .flower__leafs { position: relative; animation: blooming-flower 2s 1s backwards; }
    .flower__leafs--1 { animation-delay: calc(var(--d) + 0.8s); }
    .flower__leafs--2 { animation-delay: calc(var(--d) + 0.8s); }
    .flower__leafs--3 { animation-delay: calc(var(--d) + 0.8s); }
    .flower__leafs::after { content: ""; position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); width: 8vmin; height: 8vmin; background-color: var(--color-petalo-neon); filter: blur(10vmin); }
    .flower__leaf { position: absolute; bottom: 0; left: 50%; width: 8vmin; height: 11vmin; border-radius: 51% 49% 47% 53%/44% 45% 55% 69%; background-color: var(--color-petalo-principal); background-image: linear-gradient(to top, var(--color-petalo-gradiente), var(--color-petalo-principal)); transform-origin: bottom center; opacity: 0.9; box-shadow: inset 0 0 2vmin rgba(255, 255, 255, 0.5); }
    .flower__leaf--1 { transform: translate(-10%, 1%) rotateY(40deg) rotateX(-50deg); }
    .flower__leaf--2 { transform: translate(-50%, -4%) rotateX(40deg); }
    .flower__leaf--3 { transform: translate(-90%, 0%) rotateY(45deg) rotateX(50deg); }
    .flower__leaf--4 { width: 8vmin; height: 8vmin; transform-origin: bottom left; border-radius: 4vmin 10vmin 4vmin 4vmin; transform: translate(0%, 18%) rotateX(70deg) rotate(-43deg); z-index: 1; opacity: 0.8; }
    .flower__white-circle { position: absolute; left: -3.5vmin; top: -3vmin; width: 9vmin; height: 4vmin; border-radius: 50%; background-color: var(--color-centro-flor); }
    .flower__white-circle::after { content: ""; position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); width: 60%; height: 60%; border-radius: inherit; background-image: repeating-linear-gradient(135deg, rgba(0, 0, 0, 0.03) 0px, rgba(0, 0, 0, 0.03) 1px, transparent 1px, transparent 12px), repeating-linear-gradient(45deg, rgba(0, 0, 0, 0.03) 0px, rgba(0, 0, 0, 0.03) 1px, transparent 1px, transparent 12px), linear-gradient(90deg, var(--color-centro-flor-sombra), var(--color-centro-flor-sombra)); }
    .flower__line { width: 1.5vmin; background-image: linear-gradient(to left, var(--color-sombra-hojas), transparent, var(--color-luz-hojas)), linear-gradient(to top, transparent 10%, var(--color-tallo-principal), var(--color-tallo-principal)); box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5); animation: grow-flower-tree 3s backwards; position: relative; }
    .flower__line__leaf { --w: 7vmin; --h: calc(var(--w) + 2vmin); position: absolute; top: 20%; left: 90%; width: var(--w); height: var(--h); border-top-right-radius: var(--h); border-bottom-left-radius: var(--h); background-image: linear-gradient(to top, rgba(20, 122, 20, 0.4), var(--color-tallo-hoja)); }
    .flower__line__leaf--1 { transform: rotate(70deg) rotateY(30deg); animation: blooming-leaf-right var(--fl-speed) 1.6s backwards; }
    .flower__line__leaf--2 { top: 45%; transform: rotate(70deg) rotateY(30deg); animation: blooming-leaf-right var(--fl-speed) 1.4s backwards; }
    .flower__line__leaf--3, .flower__line__leaf--4, .flower__line__leaf--6 { border-top-right-radius: 0; border-bottom-left-radius: 0; border-top-left-radius: var(--h); border-bottom-right-radius: var(--h); left: -460%; top: 12%; transform: rotate(-70deg) rotateY(30deg); }
    .flower__line__leaf--3 { animation: blooming-leaf-left var(--fl-speed) 1.2s backwards; }
    .flower__line__leaf--4 { top: 40%; animation: blooming-leaf-left var(--fl-speed) 1s backwards; }
    .flower__line__leaf--5 { top: 0; transform-origin: left; transform: rotate(70deg) rotateY(30deg) scale(0.6); animation: blooming-leaf-right var(--fl-speed) 1.8s backwards; }
    .flower__line__leaf--6 { top: -2%; left: -450%; transform-origin: right; transform: rotate(-70deg) rotateY(30deg) scale(0.6); animation: blooming-leaf-left var(--fl-speed) 2s backwards; }
    .flower__light { position: absolute; bottom: 0vmin; width: 1vmin; height: 1vmin; background-color: var(--color-luz-particula-1); border-radius: 50%; filter: blur(0.2vmin); animation: light-ans 4s linear infinite backwards; }
    .flower__light:nth-child(odd) { background-color: var(--color-luz-particula-2); }
    .flower__light--1 { left: -2vmin; animation-delay: 1s; }
    .flower__light--2 { left: 3vmin; animation-delay: 0.5s; }
    .flower__light--3 { left: -6vmin; animation-delay: 0.3s; }
    .flower__light--4 { left: 6vmin; animation-delay: 0.9s; }
    .flower__light--5 { left: -1vmin; animation-delay: 1.5s; }
    .flower__light--6 { left: -4vmin; animation-delay: 3s; }
    .flower__light--7 { left: 3vmin; animation-delay: 2s; }
    .flower__light--8 { left: -6vmin; animation-delay: 3.5s; }
    .flower__grass { --c: var(--color-pasto-brillante); --line-w: 1.5vmin; position: absolute; bottom: 12vmin; left: -7vmin; display: flex; flex-direction: column; align-items: flex-end; z-index: 20; transform-origin: bottom center; transform: rotate(-48deg) rotateY(40deg) }
    .flower__grass--1 { animation: moving-grass 2s linear infinite }
    .flower__grass--2 { left: 2vmin; bottom: 10vmin; transform: scale(.5) rotate(75deg) rotateX(10deg) rotateY(-200deg); opacity: .8; z-index: 0; animation: moving-grass--2 1.5s linear infinite }
    .flower__grass--top { width: 7vmin; height: 10vmin; border-top-right-radius: 100%; border-right: var(--line-w) solid var(--c); transform-origin: bottom center; transform: rotate(-2deg) }

    .flower__grass__leaf { --size: 10vmin; position: absolute; width: calc(var(--size) * 2.1); height: var(--size); border-top-left-radius: var(--size); border-top-right-radius: var(--size); background-image: linear-gradient(to top, transparent, transparent 30%, var(--c)); z-index: 100 }

    .flower__grass__leaf--4 { top: 6%; left: -135%; --size: 8vmin; transform: rotate(2deg); animation: growing-grass-ans--4 2s 2s linear backwards }

    .flower__grass__leaf--6 { top: 22%; left: -180%; --size: 10vmin; transform: rotate(10deg); animation: growing-grass-ans--6 2s 1.6s linear backwards }
    .flower__grass__leaf--7 { top: 39%; left: 70%; --size: 10vmin; transform: rotate(-10deg); animation: growing-grass-ans--7 2s 1.4s linear backwards }

    .flower__grass__overlay { position: absolute; top: -10%; right: 0%; width: 100%; height: 100%; background-color: rgba(0, 0, 0, .6); filter: blur(1.5vmin); z-index: 100 }
    .flower__g-long { --w: 2vmin; --h: 6vmin; --c: var(--color-tallo-hoja); position: absolute; bottom: 10vmin; left: -3vmin; transform-origin: bottom center; transform: rotate(-30deg) rotateY(-20deg); display: flex; flex-direction: column; align-items: flex-end; animation: flower-g-long-ans 3s linear infinite }
    .flower__g-long__top { top: calc(var(--h) * -1); width: calc(var(--w) + 1vmin); height: var(--h); border-top-right-radius: 100%; border-right: .7vmin solid var(--c); transform: translate(-.7vmin, 1vmin) }
    .flower__g-long__bottom { width: var(--w); height: 50vmin; transform-origin: bottom center; background-image: linear-gradient(to top, transparent 30%, var(--c)); box-shadow: inset 0 0 2px rgba(0, 0, 0, .5); clip-path: polygon(35% 0, 65% 1%, 100% 100%, 0% 100%) }
    .flower__g-right { position: absolute; bottom: 6vmin; left: -2vmin; transform-origin: bottom left; transform: rotate(20deg) }
    .flower__g-right .leaf { width: 30vmin; height: 50vmin; border-top-left-radius: 100%; border-left: 2vmin solid var(--color-pasto-brillante); background-image: linear-gradient(to bottom, transparent, var(--color-fondo-oscuro) 60%); -webkit-mask-image: linear-gradient(to top, transparent 30%, var(--color-pasto-brillante) 60%) }
    .flower__g-right--1 { animation: flower-g-right-ans 2.5s linear infinite }

    <!-- ===== ESTRUCTURA HTML PARA LA TARJETA DE AMOR ===== -->
    <div id="love-card-overlay" class="love-card-overlay">
        <div id="love-card" class="love-card">
            <span class="close-btn">&times;</span>
            <p id="love-text" class="love-text"></p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const audioOverlay = document.getElementById('audio-overlay');
            const music = document.getElementById('background-music');
          
            function startExperience() {
                const playPromise = music.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => { console.log("Autoplay fue prevenido."); });
                }
                document.body.classList.remove("container");
                audioOverlay.style.opacity = '0';
                setTimeout(() => { audioOverlay.style.display = 'none'; }, 800);
            }
            
            audioOverlay.addEventListener('click', startExperience);

            const particleContainer = document.querySelector('.background-particles');
            const numberOfParticles = 60; 
            for (let i = 0; i < numberOfParticles; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDuration = (Math.random() * 8 + 5) + 's'; 
                particle.style.animationDelay = (Math.random() * 10) + 's';
                particleContainer.appendChild(particle);
            }
        });      
    </script>
    
    <!-- ===== SCRIPT MEJORADO PARA LA LÓGICA DE LA TARJETA ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // --- Elementos de la tarjeta ---
            const stemImages = document.querySelectorAll('.head-stem__image');
            const loveCardOverlay = document.getElementById('love-card-overlay');
            const loveCard = document.getElementById('love-card');
            const loveText = document.getElementById('love-text');

            // --- Contenido Aleatorio Original (NO MODIFICAR) ---
            const cardBackgrounds = [ 'https://www.dl.dropboxusercontent.com/scl/fi/1m5h2gqgg5sbrg1wwxxw4/card1.jpg?rlkey=ss1wvmlsl1m92i7jhv8nfkjy7&st=0dny4j9g', 'https://www.dl.dropboxusercontent.com/scl/fi/z7ra7sjam663iar04blbn/card2.jpg?rlkey=x8wdazv2f4u9o62s2xtzv5u57&st=cepvg69j', 'https://www.dl.dropboxusercontent.com/scl/fi/nph5kedztfx1fmeta4s5x/card3.jpg?rlkey=9duu8t0tahduoecyrlk0u5sjk&st=e57mxscd' ];
            const loveMessages = [
                "FELIZ DIA 30 DE SEPTIEMBRE MI AMORCITO.",
                "Me encanta acompañarte en el rave Roblox y más juegos me encanta compartirlos contigo corazón",
                "Me encantas mi amor que ño eres amargado y todo lo quiera jugar lo juegas conmigo",
                "Pienso en ti dormida o despierta pienso en ti por eso me preguntó si no te cansas por pasar todo el tiempo en mi mente preciosote",
                "Gracias mi amorcito por seguir luchando apresar de todo lo que te a pasado",
                "Eres mi lugar seguro con quién puedo confiar cosita preciosa",
                "Cada día contigo es un privilegio y me me facina estar a tu lado siempre mi cosita preciosa",
                "Eres el mejor mi amorcito y me encanta que te ezfuerses día a dia"
            ];
            
            // --- Copias para la selección aleatoria sin repetición ---
            let availableBackgrounds = [...cardBackgrounds];
            let availableMessages = [...loveMessages];


            // --- Funciones para abrir y cerrar ---
            function openCard(event) {
                // Detenemos la propagación para evitar cierres accidentales.
                event.stopPropagation(); 
                
                // Si la lista de fondos disponibles está vacía, la rellenamos de nuevo.
                if (availableBackgrounds.length === 0) {
                    availableBackgrounds = [...cardBackgrounds];
                }
                
                // Si la lista de mensajes disponibles está vacía, la rellenamos de nuevo.
                if (availableMessages.length === 0) {
                    availableMessages = [...loveMessages];
                }

                // Seleccionamos un índice aleatorio de los elementos disponibles.
                const bgIndex = Math.floor(Math.random() * availableBackgrounds.length);
                // Extraemos el elemento de la lista para que no se pueda volver a seleccionar.
                const randomBg = availableBackgrounds.splice(bgIndex, 1)[0];

                // Hacemos lo mismo para los mensajes.
                const msgIndex = Math.floor(Math.random() * availableMessages.length);
                const randomMsg = availableMessages.splice(msgIndex, 1)[0];

                // Asignamos los valores seleccionados.
                loveCard.style.backgroundImage = `url('${randomBg}')`;
                loveText.textContent = randomMsg;

                // Mostramos la tarjeta.
                loveCardOverlay.style.display = 'flex';
                setTimeout(() => {
                    loveCardOverlay.style.opacity = '1';
                    loveCardOverlay.classList.add('visible');
                }, 10);
            }

            function closeCard() {
                loveCardOverlay.style.opacity = '0';
                loveCardOverlay.classList.remove('visible');
                setTimeout(() => {
                    loveCardOverlay.style.display = 'none';
                }, 400); // Coincide con la duración de la transición en CSS
            }

            // --- Asignar Eventos ---
            // Abrir la tarjeta al hacer clic en una imagen de tallo
            stemImages.forEach(image => {
                image.addEventListener('click', openCard);
            });

            // Cerrar la tarjeta al hacer clic en cualquier lugar de la superposición.
            loveCardOverlay.addEventListener('click', closeCard);
        });
    </script>
